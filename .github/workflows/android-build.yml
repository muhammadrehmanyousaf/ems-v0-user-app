name: Build Android APK

# Free, EAS-free Android APK build. Runs on push to main and on manual dispatch.
# Produces an installable (debug-signed release) APK as a downloadable artifact.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'consumer-app-plan/**'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_API_URL: https://ems-v0-backend-production.up.railway.app/api/v1
      EXPO_PUBLIC_APP_ENV: production
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (Gradle)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/weddingwala.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weddingwala-android-apk
          path: out/weddingwala.apk
          if-no-files-found: error
          retention-days: 30
